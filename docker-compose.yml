version: "3.9"

services:
  ha-dashboard:
    build: .
    container_name: ha-dashboard
    restart: unless-stopped
    ports:
      - "3002:3000"      # Change left side to remap host port, e.g. "8080:3000"
    volumes:
      - ha-dashboard-data:/data   # Persists HA credentials + entity config
    environment:
      - NODE_ENV=production

volumes:
  ha-dashboard-data:
